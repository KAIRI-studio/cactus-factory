<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#263a31" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="サボテン工場" />
  <title>サボテン育成ライン</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preload" as="image" href="assets/kairi-studio-logo.png" fetchpriority="high" />
  <style id="launch-critical">html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}.game[aria-hidden="true"],#titleScreen[hidden]{display:none!important}body.launching{background:#fff}#brandSplash{position:fixed;z-index:1000;inset:-2px;display:flex;align-items:center;justify-content:center;width:auto;max-width:none;height:auto;min-height:calc(100dvh + 4px);margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:#fff}#brandSplash img{width:min(43%,210px);height:auto}</style>
  <link rel="preload" as="image" type="image/webp" href="assets/title-hero-v3.webp" />
  <link rel="preload" as="image" type="image/webp" href="assets/title-logo-v3.webp" />
  <link rel="preload" as="image" type="image/webp" href="assets/title-start-v2.webp" />
  <link rel="stylesheet" href="styles.css?v=134" />
  <link rel="stylesheet" href="title-v3.css?v=2" />
  <script src="game.js?v=134" defer></script>
</head>
<body class="launching">
  <section class="brand-splash" id="brandSplash" aria-label="KAIRI studio">
    <span class="splash-glow" aria-hidden="true"></span>
    <img src="assets/kairi-studio-logo.png" alt="KAIRI studio" />
  </section>
  <section class="title-screen" id="titleScreen" aria-label="サボテン工場 タイトル画面" hidden>
    <img class="title-greenhouse" src="assets/title-hero-v3.webp" alt="" />
    <div class="title-light" aria-hidden="true"></div>
    <div class="title-dust" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="title-cactus-field" aria-hidden="true">
      <span class="title-cactus title-cactus-1"><img src="assets/cactus-normal.png" alt="" /></span>
      <span class="title-cactus title-cactus-2"><img src="assets/cactus-normal.png" alt="" /></span>
      <span class="title-cactus title-cactus-3"><img src="assets/cactus-normal.png" alt="" /></span>
      <span class="title-cactus title-cactus-4"><img src="assets/cactus-normal.png" alt="" /></span>
      <span class="title-cactus title-cactus-5"><img src="assets/cactus-normal.png" alt="" /></span>
      <span class="title-cactus title-cactus-6"><img src="assets/cactus-normal.png" alt="" /></span>
    </div>
    <div class="title-copy">
      <h1 class="sr-only">サボテン工場</h1>
      <img class="title-logo" src="assets/title-logo-v3.webp" alt="サボテン工場 CACTUS FACTORY" />
      <button class="start-game" id="startGameButton" type="button" aria-label="はじめる" disabled><img src="assets/title-start-v2.webp" alt="" aria-hidden="true" /></button>
    </div>
  </section>
  <div class="screen-shutter" id="screenShutter" aria-hidden="true"><i></i><i></i><span>CACTUS FACTORY</span></div>
  <main class="game" aria-label="サボテン育成ゲーム" aria-hidden="true">
    <img class="greenhouse greenhouse-back" src="assets/original-sand-factory-v2.png" alt="" />
    <div class="light-effect" aria-hidden="true"></div>
    <div class="mist-effect" aria-hidden="true"></div>
    <div class="air-effect" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="sensor-effect" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="ambient-glow" aria-hidden="true"></div>
    <div class="ambient-specks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <header class="topbar">
      <div class="coin-chip"><span class="coin">C</span><span><small>コイン</small><b id="coinCount">120</b></span></div>
    </header>
    <section class="cultivation-zone" aria-label="24個のサボテン栽培場所">
      <div class="nursery" id="nursery"></div>
    </section>
    <aside class="special-nutrient" id="specialNutrient" role="status" aria-label="レア栄養剤 使用中" hidden><img src="assets/rare-nutrient-crate-bold.png" alt="" /></aside>
    <nav class="actions" aria-label="メニュー">
      <button class="primary" id="mathButton" type="button"><span class="action-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="4"/><path d="M8 8h8M9 12h.01M15 12h.01M9 16h.01M15 16h.01"/></svg></span><b>けいさん</b><small>10問チャレンジ</small></button>
      <button id="equipmentButton" type="button"><span class="action-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg></span><b>せつび</b><small id="equipmentLevelText">レベル 1</small></button>
      <button id="zukanButton" type="button"><span class="action-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5.5c3.2-.7 5.9.1 8 2.2 2.1-2.1 4.8-2.9 8-2.2v13c-3.2-.7-5.9.1-8 2.2-2.1-2.1-4.8-2.9-8-2.2zM12 7.7v13"/><path d="M8.8 15.2v-3.4M8.8 13.1c-1.2 0-1.8-.7-1.8-1.7M8.8 12.6c1.1 0 1.7-.7 1.7-1.7"/></svg></span><b>ずかん</b><small>あつめた サボテン</small></button>
    </nav>
    <dialog id="mathDialog"><section class="dialog-card math-card">
      <button class="close" id="mathClose" aria-label="閉じる">×</button>
      <div class="challenge-head"><span id="questionNumber">1 / 10</span><b id="score">せいかい 0</b></div>
      <h2>けいさんチャレンジ</h2><p class="problem" id="mathProblem"></p>
      <div class="answers" id="answerGrid"></div><p class="feedback" id="mathFeedback"></p>
    </section></dialog>
    <dialog id="resultDialog"><section class="dialog-card result-card">
      <small>チャレンジけっか</small><h2 id="resultTitle">10もんちゅう 0もんせいかい</h2>
      <div class="result-growth"><b id="grownCount">0こ</b><span>しゅうかく できるようになりました</span></div>
      <button class="confirm" id="resultClose">おんしつに もどる</button>
    </section></dialog>
    <dialog id="equipmentDialog"><section class="dialog-card equipment-dialog-card">
      <button class="close" id="equipmentClose" aria-label="閉じる">×</button>
      <small>おんしつの せつび</small><h2>せつびを つよくする</h2>
      <div class="equipment-summary"><div><span>ぜんたいレベル</span><b id="equipmentTotalText">4 / 12</b></div><div class="equipment-meter"><i id="equipmentMeterFill"></i></div></div>
      <div class="equipment-grid" id="equipmentGrid"></div>
      <section class="special-shop" id="specialShop" hidden>
        <div><span>★</span><p><b>レア栄養剤</b><small>つぎにそだつ 1たいが レアいじょう</small></p></div>
        <button id="specialSeedButton" type="button">300コイン</button>
      </section>
      <p class="feedback" id="equipmentFeedback"></p>
      <section class="test-tools"><small>テスト用</small><div><button id="fillTestButton" type="button">まんたんにする</button><button class="danger" id="resetTestButton" type="button">データをリセット</button></div></section>
    </section></dialog>
    <dialog id="resetDialog"><section class="dialog-card reset-card">
      <small>テスト用メニュー</small><h2>データをリセット？</h2><p>コイン・せつび・ずかんを、すべて最初の状態にもどします。</p>
      <div class="reset-actions"><button id="resetCancelButton" type="button">やめる</button><button class="danger" id="resetConfirmButton" type="button">リセットする</button></div>
    </section></dialog>
    <dialog id="zukanDialog"><section class="dialog-card zukan-card">
      <button class="close" id="zukanClose" aria-label="閉じる">×</button>
      <small>あつめた サボテン</small><h2>サボテンずかん</h2><span class="collection-progress" id="collectionProgress">0 / 9</span>
      <div class="zukan-hero"><img id="zukanHeroImage" src="assets/cactus-normal.png" alt="" /><div><small id="zukanHeroRarity">ノーマル</small><b id="zukanHeroName">みどりサボテン</b></div></div>
      <div class="zukan-grid" id="zukanGrid"></div>
    </section></dialog>
  </main>
</body>
</html>
